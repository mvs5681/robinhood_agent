[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trader"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # langchain-mcp-adapters 0.3.x declares mcp>=1.24.0 with no upper bound;
    # mcp 2.0.0 relocated RequestContext out of mcp.shared.context, which
    # langchain-mcp-adapters' callbacks.py still imports from there, so an
    # unpinned build breaks on import. Cap below the breaking major release.
    "langchain-mcp-adapters>=0.1,<0.4",
    "mcp>=1.24,<2",
    "langchain-anthropic>=0.3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff",
    "mypy",
]
live = [
    "aiohttp>=3.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: requires UW_API_TOKEN env var (deselect with -m 'not live')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
